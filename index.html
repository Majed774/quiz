<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة الإتحاد الرمضانية – العشر الأواخر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#7C3AED;--primary-light:#A78BFA;--primary-dark:#5B21B6;
    --secondary:#F59E0B;--accent:#EC4899;--accent2:#10B981;
    --bg:#F5F3FF;--bg2:#FFFFFF;--bg3:#EDE9FE;
    --text:#1E1B4B;--text-muted:#6B7280;--text-light:#9CA3AF;
    --green:#059669;--red:#DC2626;--orange:#D97706;
    --gold:#D97706;
    --shadow:0 4px 24px rgba(124,58,237,.13);
    --shadow-lg:0 16px 56px rgba(124,58,237,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;position:relative;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 700px 600px at 5% 5%,rgba(167,139,250,.3) 0%,transparent 70%),
    radial-gradient(ellipse 500px 400px at 95% 85%,rgba(236,72,153,.18) 0%,transparent 70%),
    radial-gradient(ellipse 400px 400px at 50% 55%,rgba(245,158,11,.1) 0%,transparent 70%);}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .star{position:absolute;border-radius:50%;animation:floatBubble var(--dur) var(--delay) infinite ease-in-out;}
  @keyframes floatBubble{0%,100%{transform:translateY(0) scale(1);opacity:.7}50%{transform:translateY(-20px) scale(1.1);opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(50px) scale(.93)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes fadeOut{to{opacity:0;pointer-events:none;visibility:hidden}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
  @keyframes shake2{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes bounceIn{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
  @keyframes countIn{from{transform:scale(1.4);opacity:0}to{transform:scale(1);opacity:1}}

  /* ===== ALREADY PLAYED ===== */
  #alreadyPlayedScreen{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(245,243,255,.94);backdrop-filter:blur(20px);}
  #alreadyPlayedScreen.show{display:flex;}
  .played-card{width:100%;max-width:480px;margin:20px;background:var(--bg2);border:2px solid rgba(220,38,38,.2);border-radius:28px;padding:44px 40px;text-align:center;position:relative;overflow:hidden;box-shadow:0 32px 80px rgba(220,38,38,.1);animation:slideUp .7s cubic-bezier(.34,1.56,.64,1);}
  .played-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#F87171,#DC2626,#F87171);}
  .played-icon{font-size:4rem;margin-bottom:16px;animation:shake .6s ease;}
  .played-title{font-family:'Amiri',serif;font-size:1.9rem;color:var(--red);margin-bottom:10px;}
  .played-msg{color:var(--text-muted);font-size:.9rem;line-height:1.8;margin-bottom:20px;}
  .played-name{background:var(--bg3);border:1.5px solid rgba(124,58,237,.25);border-radius:12px;padding:12px 20px;font-size:1rem;color:var(--primary);font-weight:700;margin-bottom:16px;}
  .played-score-box{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);border:2px solid rgba(124,58,237,.3);border-radius:14px;padding:18px;margin-bottom:8px;}
  .played-score-num{font-family:'Amiri',serif;font-size:2.4rem;color:var(--primary);font-weight:700;}
  .played-score-label{font-size:.82rem;color:var(--text-muted);margin-top:4px;}
  .played-result-box{border-radius:12px;padding:12px 16px;font-size:.85rem;font-weight:700;margin-top:8px;}
  .played-result-box.correct{background:#D1FAE5;border:2px solid #6EE7B7;color:var(--green);}
  .played-result-box.wrong{background:#FEE2E2;border:2px solid #FCA5A5;color:var(--red);}
  .played-result-box.timeup{background:#FEF3C7;border:2px solid #FCD34D;color:var(--orange);}

  /* ===== LOCKED ===== */
  #lockedOverlay{position:fixed;inset:0;background:rgba(245,243,255,.97);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;backdrop-filter:blur(20px);}
  #lockedOverlay.show{display:flex;}
  .lock-icon{font-size:5rem;margin-bottom:24px;animation:shake .5s ease;}
  .lock-title{font-family:'Amiri',serif;font-size:2rem;color:var(--red);margin-bottom:12px;}
  .lock-msg{color:var(--text-muted);font-size:1rem;max-width:400px;line-height:1.7;margin-bottom:32px;}
  .lock-btn{background:linear-gradient(135deg,var(--red),#F87171);border:none;color:#fff;padding:14px 40px;border-radius:14px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s;box-shadow:0 8px 24px rgba(220,38,38,.3);}
  .lock-btn:hover{transform:translateY(-3px);}

  /* ===== NAME SCREEN ===== */
  #nameScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;}
  #nameScreen.hide{animation:fadeOut .6s ease forwards;}
  .name-card{width:100%;max-width:480px;margin:20px;background:var(--bg2);border-radius:32px;padding:52px 44px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow-lg),0 0 0 1px rgba(124,58,237,.1);animation:slideUp .8s cubic-bezier(.34,1.56,.64,1);}
  .name-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--accent),var(--secondary));}
  .trophy-wrap{width:96px;height:96px;background:linear-gradient(135deg,#EDE9FE,#DDD6FE);border-radius:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:2.8rem;box-shadow:0 8px 28px rgba(124,58,237,.22);position:relative;z-index:1;}
  .name-title{font-family:'Amiri',serif;font-size:1.75rem;color:var(--primary);margin-bottom:6px;position:relative;z-index:1;line-height:1.4;}
  .name-subtitle{color:var(--text-muted);font-size:.88rem;line-height:1.8;margin-bottom:32px;position:relative;z-index:1;}
  .name-input-wrap{position:relative;z-index:1;margin-bottom:16px;}
  .name-input-label{display:block;text-align:right;font-size:.82rem;color:var(--primary);font-weight:700;margin-bottom:8px;}
  .name-input{width:100%;background:var(--bg3);border:2px solid rgba(124,58,237,.2);border-radius:16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:600;padding:16px 20px;outline:none;transition:all .3s;text-align:center;}
  .name-input::placeholder{color:var(--text-light);font-weight:400;}
  .name-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 5px rgba(124,58,237,.12);}
  .name-input.error{border-color:var(--red);animation:shake2 .4s ease;}
  .name-error{color:var(--red);font-size:.82rem;margin-top:8px;display:none;text-align:center;}
  .name-error.show{display:block;}
  .enter-btn{width:100%;background:linear-gradient(135deg,var(--primary),var(--accent));border:none;border-radius:16px;color:#fff;font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:800;padding:18px;cursor:pointer;transition:all .3s;position:relative;z-index:1;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 28px rgba(124,58,237,.36);}
  .enter-btn:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(124,58,237,.46);}
  .name-rules{margin-top:20px;background:#FEF3C7;border:2px solid #FCD34D;border-radius:14px;padding:12px 16px;position:relative;z-index:1;}
  .name-rules p{color:#92400E;font-size:.8rem;line-height:1.8;}

  /* ===== MAIN PAGE ===== */
  .page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
  .progress-bar{height:4px;background:rgba(124,58,237,.1);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent),var(--secondary));width:100%;transition:width 1s linear;}
  .header{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(124,58,237,.1);box-shadow:0 2px 16px rgba(124,58,237,.07);}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{font-size:1.6rem;}
  .logo-text{font-family:'Amiri',serif;font-size:1.2rem;color:var(--primary);font-weight:700;line-height:1.3;}
  .logo-sub{font-size:.7rem;color:var(--text-muted);margin-top:1px;}
  .header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
  .player-name-badge{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#EDE9FE,#DDD6FE);border:1.5px solid rgba(124,58,237,.3);padding:7px 14px;border-radius:20px;font-size:.85rem;font-weight:700;color:var(--primary);}
  .live-badge{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#D1FAE5,#A7F3D0);border:1.5px solid #6EE7B7;padding:5px 14px;border-radius:20px;font-size:.78rem;color:var(--green);font-weight:700;}
  .live-dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite;}

  /* QUESTION PROGRESS INDICATOR */
  .q-progress-strip{background:rgba(255,255,255,.9);border-bottom:1px solid rgba(124,58,237,.08);padding:10px 24px;display:flex;align-items:center;justify-content:center;gap:12px;}
  .q-dot{width:36px;height:8px;border-radius:4px;background:rgba(124,58,237,.15);transition:all .4s;}
  .q-dot.done{background:var(--green);}
  .q-dot.active{background:linear-gradient(90deg,var(--primary),var(--accent));animation:pulseBar 1.5s infinite;}
  @keyframes pulseBar{0%,100%{opacity:1}50%{opacity:.6}}
  .q-progress-label{font-size:.8rem;color:var(--text-muted);font-weight:600;}

  /* WAITING */
  #waitingState{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;}
  .wait-ring{width:152px;height:152px;border-radius:50%;background:linear-gradient(135deg,#EDE9FE,#FDF4FF);display:flex;align-items:center;justify-content:center;margin:0 auto 32px;position:relative;box-shadow:0 12px 40px rgba(124,58,237,.15);}
  .wait-ring::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:4px solid transparent;border-top-color:var(--primary);border-right-color:var(--accent);animation:spin 2s linear infinite;}
  .wait-icon{font-size:3.2rem;}
  .wait-title{font-family:'Amiri',serif;font-size:2.2rem;color:var(--primary);margin-bottom:12px;}
  .wait-msg{color:var(--text-muted);font-size:1rem;line-height:1.8;max-width:450px;}
  .next-countdown{margin-top:28px;background:var(--bg2);border:2px solid rgba(124,58,237,.18);border-radius:22px;padding:22px 44px;box-shadow:var(--shadow);}
  .next-label{font-size:.8rem;color:var(--primary);font-weight:700;margin-bottom:8px;}
  .next-time{font-family:'Amiri',serif;font-size:2.6rem;color:var(--primary);font-weight:700;letter-spacing:3px;}

  /* QUESTION */
  #questionState{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;}
  #questionState.show{display:flex;}
  .q-card{width:100%;max-width:740px;background:var(--bg2);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg),0 0 0 1px rgba(124,58,237,.07);animation:slideUp .5s cubic-bezier(.34,1.56,.64,1);}
  .q-header{background:linear-gradient(135deg,var(--primary),#6D28D9);padding:22px 28px;display:flex;align-items:center;justify-content:space-between;}
  .q-header-left{display:flex;flex-direction:column;gap:4px;}
  .q-label{font-size:.78rem;color:rgba(255,255,255,.72);font-weight:600;letter-spacing:1px;}
  .q-player{font-size:.9rem;color:#fff;font-weight:700;}
  .q-num-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:4px 12px;font-size:.82rem;color:#fff;font-weight:700;margin-top:4px;display:inline-block;}
  .timer-wrap{position:relative;width:72px;height:72px;}
  .timer-svg{width:72px;height:72px;transform:rotate(-90deg);}
  .timer-track{fill:none;stroke:rgba(255,255,255,.2);stroke-width:5;}
  .timer-prog{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .5s;}
  .timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;color:#fff;font-family:'Amiri',serif;}
  .q-body{padding:28px 32px;}
  .q-number{font-size:.78rem;color:var(--primary);font-weight:700;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .q-number::before{content:'';width:24px;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:2px;}
  .q-text{font-family:'Amiri',serif;font-size:1.5rem;line-height:1.75;color:var(--text);margin-bottom:24px;text-align:center;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .opt-btn{background:var(--bg3);border:2px solid rgba(124,58,237,.15);border-radius:16px;padding:16px 18px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:12px;font-family:'Tajawal',sans-serif;text-align:right;width:100%;}
  .opt-btn:hover:not(:disabled){border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.18);background:#fff;}
  .opt-btn.selected{background:linear-gradient(135deg,#EDE9FE,#DDD6FE)!important;border-color:var(--primary)!important;box-shadow:0 4px 16px rgba(124,58,237,.2);}
  .opt-btn.selected .opt-letter{background:linear-gradient(135deg,var(--primary),var(--accent))!important;color:#fff!important;}
  .opt-btn.correct{background:linear-gradient(135deg,#D1FAE5,#A7F3D0)!important;border-color:#6EE7B7!important;}
  .opt-btn.wrong{background:linear-gradient(135deg,#FEE2E2,#FECACA)!important;border-color:#FCA5A5!important;}
  .opt-btn:disabled{cursor:not-allowed;opacity:.85;}
  .opt-letter{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:#fff;flex-shrink:0;transition:all .25s;}
  .opt-btn.correct .opt-letter{background:linear-gradient(135deg,var(--green),#34D399)!important;}
  .opt-btn.wrong .opt-letter{background:linear-gradient(135deg,var(--red),#F87171)!important;}
  .opt-text{font-size:.92rem;font-weight:600;color:var(--text);flex:1;}
  #submitWrap{margin-top:18px;}
  #submitBtn{width:100%;background:linear-gradient(135deg,var(--primary),var(--accent));border:none;border-radius:16px;color:#fff;font-family:'Tajawal',sans-serif;font-size:1.05rem;font-weight:800;padding:16px;cursor:pointer;transition:all .3s;box-shadow:0 8px 28px rgba(124,58,237,.36);display:flex;align-items:center;justify-content:center;gap:10px;}
  #submitBtn:hover{transform:translateY(-3px);}
  #selectedHint{text-align:center;margin-top:8px;font-size:.8rem;color:var(--text-muted);font-weight:600;}

  /* Q RESULT (بين الأسئلة) */
  #qResultState{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 20px;}
  #qResultState.show{display:flex;animation:slideUp .5s cubic-bezier(.34,1.56,.64,1);}
  .qr-icon{font-size:4.5rem;margin-bottom:16px;animation:bounceIn .7s cubic-bezier(.34,1.56,.64,1);}
  .qr-title{font-family:'Amiri',serif;font-size:2.2rem;margin-bottom:8px;}
  .qr-title.win{color:var(--green);}
  .qr-title.lose{color:var(--red);}
  .qr-points{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);border:2px solid rgba(124,58,237,.25);border-radius:20px;padding:20px 40px;margin:16px 0;display:inline-block;}
  .qr-points-num{font-family:'Amiri',serif;font-size:2.8rem;color:var(--primary);font-weight:700;animation:countIn .5s ease;}
  .qr-points-label{font-size:.82rem;color:var(--text-muted);margin-top:4px;}
  .qr-correct{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);border:2px solid #6EE7B7;border-radius:14px;padding:14px 24px;font-size:.9rem;color:var(--green);font-weight:700;margin-bottom:16px;}
  .qr-next-btn{background:linear-gradient(135deg,var(--primary),var(--accent));border:none;border-radius:16px;color:#fff;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:800;padding:16px 48px;cursor:pointer;transition:all .3s;box-shadow:0 8px 28px rgba(124,58,237,.36);}
  .qr-next-btn:hover{transform:translateY(-3px);}
  .qr-daily-score{font-size:.9rem;color:var(--text-muted);font-weight:600;margin-top:12px;}

  /* ===== DAILY SUMMARY & LEADERBOARD ===== */
  #summaryState{flex:1;display:none;flex-direction:column;align-items:center;padding:32px 20px;overflow-y:auto;}
  #summaryState.show{display:flex;}
  .summary-card{width:100%;max-width:680px;background:var(--bg2);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg);animation:slideUp .6s cubic-bezier(.34,1.56,.64,1);margin-bottom:20px;}
  .summary-header{background:linear-gradient(135deg,var(--primary),var(--accent));padding:32px;text-align:center;}
  .summary-title{font-family:'Amiri',serif;font-size:2rem;color:#fff;margin-bottom:8px;}
  .summary-sub{color:rgba(255,255,255,.8);font-size:.9rem;}
  .summary-score-wrap{display:flex;align-items:center;justify-content:center;gap:32px;padding:28px 32px;border-bottom:1px solid rgba(124,58,237,.1);}
  .score-bubble{text-align:center;}
  .score-bubble-num{font-family:'Amiri',serif;font-size:3rem;color:var(--primary);font-weight:700;line-height:1;}
  .score-bubble-label{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-top:4px;}
  .score-divider{width:1px;height:60px;background:rgba(124,58,237,.15);}
  .summary-qs{padding:20px 32px;border-bottom:1px solid rgba(124,58,237,.08);}
  .summary-q-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid rgba(124,58,237,.06);}
  .summary-q-row:last-child{border-bottom:none;}
  .sq-num{width:32px;height:32px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:var(--primary);flex-shrink:0;}
  .sq-result{font-size:1.2rem;flex-shrink:0;}
  .sq-pts{font-size:.85rem;font-weight:700;color:var(--primary);background:var(--bg3);border-radius:8px;padding:3px 10px;margin-right:auto;}

  /* LEADERBOARD */
  .leaderboard-card{width:100%;max-width:680px;background:var(--bg2);border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg);animation:slideUp .7s cubic-bezier(.34,1.56,.64,1) .1s both;}
  .lb-header{background:linear-gradient(135deg,#1E1B4B,#3730A3);padding:22px 28px;display:flex;align-items:center;gap:12px;}
  .lb-title{font-family:'Amiri',serif;font-size:1.6rem;color:#fff;}
  .lb-sub{font-size:.78rem;color:rgba(255,255,255,.65);margin-top:2px;}
  .lb-list{padding:16px;}
  .lb-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;margin-bottom:6px;transition:all .2s;}
  .lb-row:last-child{margin-bottom:0;}
  .lb-row.me{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);border:2px solid rgba(124,58,237,.3);}
  .lb-row.top1{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border:2px solid #FCD34D;}
  .lb-row.top2{background:linear-gradient(135deg,#F0F9FF,#E0F2FE);border:2px solid #BAE6FD;}
  .lb-row.top3{background:linear-gradient(135deg,#FFF7ED,#FFEDD5);border:2px solid #FED7AA;}
  .lb-rank{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;flex-shrink:0;background:var(--bg3);color:var(--primary);}
  .lb-row.top1 .lb-rank{background:linear-gradient(135deg,#FCD34D,#F59E0B);color:#fff;font-size:1.3rem;}
  .lb-row.top2 .lb-rank{background:linear-gradient(135deg,#93C5FD,#3B82F6);color:#fff;}
  .lb-row.top3 .lb-rank{background:linear-gradient(135deg,#FDBA74,#F97316);color
